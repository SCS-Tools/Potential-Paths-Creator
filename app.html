<!doctype html>
<html><head><meta charset="utf-8"><script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{padding:clamp(12px,2vw,24px);background:#101216;color:#f4f6f8;font:15px "Segoe UI",sans-serif}.panel{width:100%;min-height:calc(100vh - clamp(24px,4vw,48px));margin:0;padding:clamp(19px,2.4vw,28px);border:1px solid #303744;border-radius:20px;background:linear-gradient(135deg,#1c212a,#15181e)}h1{margin:0 0 8px;color:#ff6b5f;font-size:27px}.lead{margin:0 0 25px;color:#aeb7c5;line-height:1.45}.field{margin:15px 0}.field label{display:block;margin:0 0 7px;font-weight:650;color:#f4f6f8}.optional{font-weight:400;color:#8b95a3}.pathInput{display:flex;gap:9px}input{width:100%;padding:12px 13px;border:1px solid #3a4351;border-radius:11px;background:#101216;color:#f4f6f8;font:14px Consolas,monospace;outline:none}input:focus{border-color:#ff6b5f;box-shadow:0 0 0 3px #ff6b5f25}.browse{flex:0 0 auto;padding:10px 14px;background:#292f39;border:1px solid #46505f}.browse:hover{background:#343c49}.hint{margin:6px 0 0;color:#8993a1;font-size:13px}.row{display:grid;grid-template-columns:1fr 220px;gap:14px}.actions{display:flex;align-items:center;gap:15px;margin-top:25px}button{border:0;border-radius:11px;padding:12px 19px;background:#ee6b2f;color:#fff;font:700 15px "Segoe UI",sans-serif;cursor:pointer}button:hover{background:#ff814a}button:disabled{opacity:.55;cursor:wait}.status{min-height:22px;color:#aeb7c5}.result{display:none;margin-top:24px;padding:17px;border-radius:13px;background:#101216;border:1px solid #303744}.result.ok{border-color:#3c8c67}.result.error{border-color:#bd5353}.result h2{margin:0 0 9px;font-size:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:10px;border-radius:9px;background:#1d232d}.stat b{display:block;color:#ffb18d;font-size:19px}.path{margin-top:13px;word-break:break-all;color:#b9c2ce;font-family:Consolas,monospace;font-size:13px}@media(max-width:640px){.row,.grid{grid-template-columns:1fr}.pathInput{flex-direction:column}.browse{width:100%}body{padding:12px}.panel{padding:19px}}
</style></head><body><main class="panel"><h1>Potential Paths Creator</h1><p class="lead" id="lead"></p>
<div class="field"><label for="log" id="logLabel"></label><div class="pathInput"><input id="log" type="text" spellcheck="false"><button class="browse" id="browseLog" type="button"></button></div><p class="hint" id="logHint"></p></div>
<div class="field"><label for="source" id="sourceLabel"></label><div class="pathInput"><input id="source" type="text" spellcheck="false"><button class="browse" id="browseSource" type="button"></button></div><p class="hint" id="sourceHint"></p></div>
<div class="row"><div class="field"><label for="output" id="outputLabel"></label><div class="pathInput"><input id="output" type="text" spellcheck="false"><button class="browse" id="browseOutput" type="button"></button></div></div><div class="field"><label for="filename" id="filenameLabel"></label><input id="filename" type="text" value="potential_paths.txt" spellcheck="false"></div></div>
<div class="actions"><button id="run" disabled></button><span id="status" class="status"></span></div><section id="result" class="result"></section></main>
<script>
let toolBridge,lang='ru';const $=id=>document.getElementById(id);const text={ru:{lead:'Собирает потенциальные пути из лога, файлов .sii, .sui, .mat, .tobj и полного дерева первой распаковки SCS Extractor.',log:'Путь к логу',optional:'необязательно',logHint:'Можно оставить пустым — будут обработаны только исходные файлы.',source:'Папка с исходными файлами',sourceHint:'Первая распаковка SCS Extractor. Папка сканируется рекурсивно.',output:'Папка для результата',filename:'Имя файла со списком путей',browse:'Browse…',selectLog:'Выберите лог',selectSource:'Выберите папку с исходными файлами',selectOutput:'Выберите папку для результата',run:'Создать список путей',ready:'Готово к сканированию.',working:'Сканирование…',done:'Список создан',logPaths:'Путей из лога',definitionPaths:'Путей из файлов',filePaths:'Путей из дерева',total:'Уникальных путей',files:'Просмотрено файлов',defs:'Файлов определений',saved:'Сохранено: ',errors:{source_folder_required:'Укажите папку с исходными файлами.',source_folder_not_found:'Папка с исходными файлами не найдена.',log_not_found:'Файл лога не найден.',output_folder_required:'Укажите папку для результата.',output_name_invalid:'Введите корректное имя файла без пути.',output_write_failed:'Не удалось записать файл результата.',generic:'Не удалось выполнить сканирование.'}},en:{lead:'Collects potential paths from a log, .sii, .sui, .mat and .tobj files, plus the full first-extraction file tree from SCS Extractor.',log:'Log file path',optional:'optional',logHint:'Leave empty to process only the source files.',source:'Source files folder',sourceHint:'The first SCS Extractor extraction. The folder is scanned recursively.',output:'Output folder',filename:'Output list filename',browse:'Browse…',selectLog:'Select log file',selectSource:'Select source files folder',selectOutput:'Select output folder',run:'Create path list',ready:'Ready to scan.',working:'Scanning…',done:'List created',logPaths:'Paths from log',definitionPaths:'Paths from files',filePaths:'Paths from tree',total:'Unique paths',files:'Files inspected',defs:'Definition files',saved:'Saved to: ',errors:{source_folder_required:'Enter the source files folder.',source_folder_not_found:'The source files folder was not found.',log_not_found:'The log file was not found.',output_folder_required:'Enter the output folder.',output_name_invalid:'Enter a valid filename without a path.',output_write_failed:'The output file could not be written.',generic:'The scan could not be completed.'}}};
text.ru.browse='Обзор…';
function t(){return text[lang]}function renderText(){const x=t();$('lead').textContent=x.lead;$('logLabel').innerHTML=x.log+' <span class="optional">('+x.optional+')</span>';$('logHint').textContent=x.logHint;$('sourceLabel').textContent=x.source;$('sourceHint').textContent=x.sourceHint;$('outputLabel').textContent=x.output;$('filenameLabel').textContent=x.filename;$('browseLog').textContent=x.browse;$('browseSource').textContent=x.browse;$('browseOutput').textContent=x.browse;$('run').textContent=x.run;if(!$('status').dataset.busy)$('status').textContent=x.ready}window.setLanguage=v=>{lang=text[v]?v:'en';renderText()};
function stat(label,value){return '<div class="stat"><b>'+value+'</b>'+label+'</div>'}function renderTool(data){const result=$('result'),x=t();$('run').disabled=false;$('status').dataset.busy='';if(data.status!=='ok'){result.className='result error';result.style.display='block';result.innerHTML='<h2>'+x.errors[data.code]||x.errors.generic+'</h2>';if(!data.code)result.innerHTML='<h2>'+x.errors.generic+'</h2>';$('status').textContent=x.errors[data.code]||x.errors.generic;return}$('status').textContent=x.done;result.className='result ok';result.style.display='block';result.innerHTML='<h2>'+x.done+'</h2><div class="grid">'+stat(x.logPaths,data.log_paths)+stat(x.definitionPaths,data.definition_paths)+stat(x.filePaths,data.file_paths)+stat(x.total,data.total_paths)+stat(x.files,data.files_scanned)+stat(x.defs,data.definition_files)+'</div><div class="path">'+x.saved+data.output_file+'</div>'}
function browse(kind,id,title){toolBridge.browse(kind,title,path=>{if(path)$(id).value=path})}function run(){const data={log_path:$('log').value.trim(),source_folder:$('source').value.trim(),output_folder:$('output').value.trim(),output_filename:$('filename').value.trim()};$('run').disabled=true;$('status').dataset.busy='1';$('status').textContent=t().working;setTimeout(()=>toolBridge.run(JSON.stringify(data)),20)}$('run').onclick=run;$('browseLog').onclick=()=>browse('log_file','log',t().selectLog);$('browseSource').onclick=()=>browse('source_folder','source',t().selectSource);$('browseOutput').onclick=()=>browse('output_folder','output',t().selectOutput);new QWebChannel(qt.webChannelTransport,c=>{toolBridge=c.objects.toolBridge;$('run').disabled=false;renderText();if(window.loadToolState)window.loadToolState()});
</script><style>
.actions .status{margin-left:12px}.miniLog{display:grid;gap:3px;min-height:42px;margin-top:8px;padding:8px 11px;border:1px solid #303744;border-radius:9px;background:#101216;color:#98a3b2;font:12px Consolas,monospace;line-height:1.25;overflow:hidden}.miniLog div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style><script>
document.querySelector('.actions').insertAdjacentHTML('afterend','<div id="miniLog" class="miniLog"></div>');
Object.assign(text.ru,{journal:'Журнал',logReady:'Готово к сканированию.',scanStarted:'Сканирование запущено…',scanDone:'Готово: добавлено путей — ',scanError:'Ошибка сканирования.'});
Object.assign(text.en,{journal:'Log',logReady:'Ready to scan.',scanStarted:'Scan started…',scanDone:'Done: paths added — ',scanError:'Scan failed.'});
Object.assign(text.ru,{variants:'Добавлено вариантов',added:'Новых путей',kept:'Сохранено из файла'});
Object.assign(text.en,{variants:'Extension variants added',added:'New paths added',kept:'Paths kept from file'});
let ppcResult=null,ppcLog=[{key:'logReady'}];
const ppcBaseRenderText=renderText;
function ppcStat(label,value){return '<div class="stat"><b>'+value+'</b>'+label+'</div>'}
function ppcLogText(entry){const x=t();return x.journal+': '+(x[entry.key]||entry.key)+(entry.value===undefined?'':entry.value)}
function ppcRenderLog(){$('miniLog').innerHTML=ppcLog.map(entry=>'<div>'+ppcLogText(entry)+'</div>').join('')}
function ppcAddLog(key,value){ppcLog=[...ppcLog,{key:key,value:value}].slice(-2);ppcRenderLog()}
function ppcRenderResult(data,writeLog){const result=$('result'),x=t();$('run').disabled=false;$('status').dataset.busy='';if(data.status!=='ok'){const message=x.errors[data.code]||x.errors.generic;result.className='result error';result.style.display='block';result.innerHTML='<h2>'+message+'</h2>';$('status').textContent=message;if(writeLog)ppcAddLog('scanError');return}$('status').textContent=x.done;result.className='result ok';result.style.display='block';result.innerHTML='<h2>'+x.done+'</h2><div class="grid">'+ppcStat(x.logPaths,data.log_paths)+ppcStat(x.definitionPaths,data.definition_paths)+ppcStat(x.filePaths,data.file_paths)+ppcStat(x.variants,data.variant_paths)+ppcStat(x.added,data.added_paths)+ppcStat(x.kept,data.existing_paths)+ppcStat(x.total,data.total_paths)+ppcStat(x.files,data.files_scanned)+ppcStat(x.defs,data.definition_files)+'</div><div class="path">'+x.saved+data.output_file+'</div>';if(writeLog)ppcAddLog('scanDone',data.added_paths)}
renderText=function(){ppcBaseRenderText();if(ppcResult)ppcRenderResult(ppcResult,false);ppcRenderLog()};
window.setLanguage=function(value){lang=text[value]?value:'en';renderText()};
window.loadToolState=function(){if(toolBridge)toolBridge.run(JSON.stringify({action:'load_state'}))};
window.renderTool=function(data){if(data.status==='state'){const s=data.settings||{};$('log').value=s.log_path||'';$('source').value=s.source_folder||'';$('output').value=s.output_folder||'';$('filename').value=s.output_filename||'potential_paths.txt';ppcLog=Array.isArray(data.journal)&&data.journal.length?data.journal:[{key:'logReady'}];ppcRenderLog();return}ppcResult=data;ppcRenderResult(data,true)};
function ppcRun(){const data={log_path:$('log').value.trim(),source_folder:$('source').value.trim(),output_folder:$('output').value.trim(),output_filename:$('filename').value.trim()};$('run').disabled=true;$('status').dataset.busy='1';$('status').textContent=t().working;ppcAddLog('scanStarted');setTimeout(()=>toolBridge.run(JSON.stringify(data)),20)}
$('run').onclick=ppcRun;renderText();
</script></body></html>
